# Helper build: CodeBuild packages the Lambda layer + handler and uploads them to S3.
# Every command is quoted: the unquoted ":all:" breaks YAML parsing.
version: 0.2
phases:
  build:
    commands:
      - "pip install --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=:all: --target python supabase"
      - "zip -qr deps-layer.zip python"
      - "aws s3 cp deps-layer.zip s3://${ARTIFACTS_BUCKET}/deps-layer.zip"
      - "cd worker && zip ../handler.zip lambda_distributor.py && cd .."
      - "aws s3 cp handler.zip s3://${ARTIFACTS_BUCKET}/handler.zip"
